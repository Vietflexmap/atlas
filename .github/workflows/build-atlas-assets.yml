name: Build Atlas local pages and PDF

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_atlas_assets.py'
      - '.github/workflows/build-atlas-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install asset builder dependencies
        run: python -m pip install --upgrade requests pillow img2pdf

      - name: Download 172 pages and build PDF
        run: python scripts/build_atlas_assets.py

      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail
          test -f Atlas_Vietnam_1996.pdf
          test -f pages/1.jpg
          test -f pages/172.jpg
          test -f pages/manifest.json
          count=$(find pages -maxdepth 1 -type f -name '*.jpg' | wc -l)
          echo "JPEG pages: $count"
          test "$count" -eq 172
          ls -lh Atlas_Vietnam_1996.pdf

      - name: Commit digitized local assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages Atlas_Vietnam_1996.pdf

          if git diff --cached --quiet; then
            echo "Atlas assets are already up to date."
            exit 0
          fi

          git commit -m "Add Vietflexmap digitized Atlas 172 pages and PDF"
          git push origin HEAD:main
