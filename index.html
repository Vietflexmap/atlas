<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12100d">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Atlas Việt Nam 1996 - Flipbook HTML5 172 trang. Nguồn: Vietflexmap số hóa.">
  <title>Atlas Việt Nam 1996 | Vietflexmap số hóa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn" id="tocBtn" type="button" aria-label="Mở danh sách trang" aria-expanded="false">☰</button>

      <div class="brand">
        <div class="brand-badge" aria-hidden="true">VN</div>
        <div class="brand-text">
          <h1>Atlas Việt Nam 1996</h1>
          <p>Nguồn: <strong>Vietflexmap số hóa</strong></p>
        </div>
      </div>

      <div class="top-actions">
        <a class="icon-btn link-btn" id="downloadPdf" href="Atlas_Vietnam_1996.pdf" download="Atlas_Vietnam_1996.pdf" title="Tải PDF" aria-label="Tải PDF" hidden>↓</a>
        <button class="icon-btn" id="focusBtn" type="button" title="Chế độ tập trung" aria-label="Chế độ tập trung">◉</button>
        <button class="icon-btn" id="fullscreenBtn" type="button" title="Toàn màn hình" aria-label="Toàn màn hình">⛶</button>
      </div>
    </header>

    <main class="reader">
      <div class="drawer-scrim" id="drawerScrim" hidden></div>

      <aside class="drawer" id="drawer" aria-hidden="true">
        <div class="drawer-head">
          <div>
            <span class="eyebrow">ATLAS VIỆT NAM</span>
            <strong id="drawerTitle">172 trang</strong>
          </div>
          <button class="icon-btn small" id="closeDrawerBtn" type="button" aria-label="Đóng">×</button>
        </div>
        <div class="thumb-grid" id="thumbGrid"></div>
      </aside>

      <section class="stage" id="stage" aria-label="Trình đọc Atlas dạng sách lật">
        <div class="ambient" aria-hidden="true"></div>

        <div class="loading-card" id="loadingCard" role="status" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <strong id="loadingTitle">Đang mở Atlas…</strong>
          <span id="loadingText">Đang tìm PDF local và chuẩn bị Flipbook 172 trang.</span>
          <div class="loading-progress"><i id="loadingBar"></i></div>
        </div>

        <div class="book-shell" id="bookShell" hidden>
          <div id="book" aria-label="Atlas Việt Nam 1996 - Flipbook HTML5"></div>
        </div>

        <button class="edge edge-left" id="edgePrev" type="button" aria-label="Trang trước"><span>‹</span></button>
        <button class="edge edge-right" id="edgeNext" type="button" aria-label="Trang sau"><span>›</span></button>

        <div class="source-credit">Nguồn: <strong>Vietflexmap số hóa</strong></div>
      </section>
    </main>

    <footer class="controls">
      <div class="seek-row">
        <span id="seekCurrent">001</span>
        <input id="pageRange" type="range" min="1" max="172" value="1" step="1" aria-label="Chọn trang">
        <span id="seekTotal">172</span>
      </div>

      <div class="toolbar">
        <button class="control-btn hide-mobile" id="firstBtn" type="button" title="Trang đầu" aria-label="Trang đầu">⏮</button>
        <button class="control-btn primary" id="prevBtn" type="button" title="Trang trước" aria-label="Trang trước">‹</button>

        <div class="page-box">
          <span>Trang</span>
          <input id="pageInput" type="number" min="1" max="172" value="1" inputmode="numeric" aria-label="Số trang">
          <b>/ <span id="pageTotal">172</span></b>
        </div>

        <button class="control-btn primary" id="nextBtn" type="button" title="Trang sau" aria-label="Trang sau">›</button>
        <button class="control-btn hide-mobile" id="lastBtn" type="button" title="Trang cuối" aria-label="Trang cuối">⏭</button>

        <span class="toolbar-sep hide-tablet" aria-hidden="true"></span>

        <button class="control-btn hide-tablet" id="zoomOutBtn" type="button" title="Thu nhỏ" aria-label="Thu nhỏ">−</button>
        <button class="zoom-label hide-tablet" id="zoomResetBtn" type="button" title="100%"><span id="zoomValue">100%</span></button>
        <button class="control-btn hide-tablet" id="zoomInBtn" type="button" title="Phóng to" aria-label="Phóng to">+</button>
      </div>
    </footer>

    <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="app.js"></script>
</body>
</html>
